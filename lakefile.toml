name = "Zeta23"
version = "0.1.0"
defaultTargets = ["Zeta23"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "51e6992efd06126df61a496bebf8f49482a4e129"

[[lean_lib]]
name = "Zeta23"

# --- comparator challenge/solution layer (comparator/README.md). Trusted: ChallengeDeps + Challenge
# (Mathlib-only). Untrusted: Solution (imports Zeta23). Not in defaultTargets; build with
# `lake build Challenge Solution`, or let github.com/leanprover/comparator build them itself.
[[lean_lib]]
name = "ChallengeDeps"
srcDir = "comparator"

[[lean_lib]]
name = "Challenge"
srcDir = "comparator"

[[lean_lib]]
name = "Solution"
srcDir = "comparator"

# --- ZetaQ: the conductor-aspect library (ZetaQ/README.md, and the module docstring of
# ZetaQ.lean). Imports Zeta23, including its ParamsQ/WindowD and Tail/GevreyTail layers.
# Kept out of defaultTargets because it carries four sorries — the Beurling–Selberg input of
# the SHARP large sieve (ZetaQ.l2_concentration_exists; since the Gallagher rethread no headline
# consumes it) and three frozen superseded statements — so that `lake build` remains the Zeta23 record's own sorry-free
# gate. Build it with `lake build ZetaQ`.
[[lean_lib]]
name = "ZetaQ"

# --- ZetaS and ZetaShell: the RH-72 FOLLOW-UP libraries (plan: mathsrh/rh72/LEAN_PLAN.md; board:
# mathsrh/rh72/lean_board/BOARD.md). ZetaS is the zeta follow-up (imports Zeta23); ZetaShell is the
# family follow-up (imports ZetaQ). During development they carry the Phase-1 skeleton, i.e. node
# statements closed by `sorry`, which are replaced one by one by proofs with name and statement kept
# byte-identical; each release states its trust level (LEAN_PLAN section 0). Kept out of
# defaultTargets for the same reason as ZetaQ: `lake build` stays the Zeta23 record's own sorry-free
# gate. The glob `X.*` builds the root module X and every module under X/, so a new skeleton or node
# file is built without being added to the root. Build with `lake build ZetaS ZetaShell`.
[[lean_lib]]
name = "ZetaS"
globs = ["ZetaS.*"]

[[lean_lib]]
name = "ZetaShell"
globs = ["ZetaShell.*"]

# --- ZetaSCertShims: bare-name forwarding modules for the FROZEN track-C checker v3 (ZetaS/Cert/CheckerBase,
# CheckerLeaves, CheckerCoreV3, CheckerTestsV3 are byte-identical to the audited files and import each other by bare
# names). Each module here only imports ZetaS.Cert.<same name>; built as a dependency of ZetaS.
[[lean_lib]]
name = "ZetaSCertShims"
srcDir = "ZetaSCertShims"
roots = ["CheckerBase", "CheckerLeaves", "CheckerCoreV3"]

# --- ZetaSReplay: the kernel replay of the K = 5 all-marks certificate `CertAM5` (ZetaSReplay/README.md): 1,478
# generated modules with bare names, as in ZetaSCertShims (the shards R<class>_* of the 20 reversal classes, then
# ReplayCommon, ReplayAM5 and ReplayHeadlines). ReplayHeadlines proves the hypothesis-free K = 5 theorems
# ZetaS.Top.zeta_simple_K5_uncond and ZetaS.Top.zeta_distinct_K5_uncond. Not in defaultTargets: build it with
# `lake build ZetaSReplay` (about 20 Lean-hours of CPU time, about 7 GB of build products, 1,478 modules). The replay
# was last run on 28 September 2026, module by module, against commit bb7223b; the ZetaS/ of this release differs from
# bb7223b's only in two doc-strings of ZetaS/ChallengeZetaS.lean (no declaration changed). Lake has no wildcard for
# bare module names, so `globs` lists every module (generated from ZetaSReplay/MANIFEST.sha256); with `roots` alone,
# the modules that ReplayHeadlines imports would not be found.
[[lean_lib]]
name = "ZetaSReplay"
srcDir = "ZetaSReplay"
roots = ["ReplayHeadlines"]
